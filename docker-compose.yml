name: niteowl-auth

services:
  postgres:
    image: postgres:18
    container_name: niteowl-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [niteowl-auth]

  redis:
    image: redis:8-alpine
    container_name: niteowl-auth-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [niteowl-auth]

  auth:
    image: node:24
    container_name: niteowl-auth
    restart: unless-stopped
    working_dir: /app
    command: ["bash", "/scripts/auth-start.sh"]
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${ADMIN_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${ADMIN_URL}
    volumes:
      - ./auth:/app
      - ./auth/node_modules:/app/node_modules
      - ./scripts:/scripts:ro
    ports:
      - "${AUTH_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [niteowl-auth]

  admin:
    image: node:24
    container_name: niteowl-admin
    restart: unless-stopped
    working_dir: /app
    command: ["bash", "/scripts/admin-start.sh"]
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      ADMIN_URL: ${ADMIN_URL}
      AUTH_INTERNAL_URL: http://auth:3000
    volumes:
      - ./admin:/app
      - ./admin/node_modules:/app/node_modules
      - ./scripts:/scripts:ro
    ports:
      - "${ADMIN_PORT}:3000"
    depends_on:
      auth:
        condition: service_healthy
    networks: [niteowl-auth]

networks:
  niteowl-auth:
    name: niteowl-auth
